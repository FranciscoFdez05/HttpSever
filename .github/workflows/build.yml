name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar
        run: dotnet build HttpSever.csproj -c Release

      - name: Publicar ejecutable
        run: dotnet publish HttpSever.csproj -c Release -o publish

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: HttpServer
          path: publish/HttpServer.exe

      - name: Crear release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/HttpServer.exe
          generate_release_notes: true
